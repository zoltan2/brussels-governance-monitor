name: Magazine

on:
  push:
    branches: [main]
    paths:
      - 'content/digest/**.fr.mdx'
      - 'src/lib/magazine/**'
      - 'scripts/build-magazine.ts'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: magazine-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build magazine
        id: build
        env:
          UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
        run: |
          npm run magazine:build
          if [ ! -d "docs/magazine/latest" ]; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
          else
            echo "status=built" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to gh-pages
        if: steps.build.outputs.status == 'built'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/magazine
          keep_files: true
          commit_message: "magazine: publish ${{ github.sha }}"
