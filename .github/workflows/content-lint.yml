name: Content Lint

# Principe du moindre privilege. Sans ce bloc, le GITHUB_TOKEN herite du defaut
# du depot, qui peut etre `write-all` : un workflow de verification obtenait
# alors des droits d ecriture dont il n a aucun usage (audit 21/09).
permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'content/**'
      # Pages /explainers/ : pas de frontmatter Velite, leur texte vit dans
      # messages/*.json et leur date de réécriture dans une table tenue à la
      # main (src/lib/explainer-dates.ts) que rien d'autre ne garde à jour.
      - 'messages/*.json'
      - 'src/lib/explainer-dates.ts'
      - 'src/lib/explainer-messages-date.ts'
      # (sans le segment [locale] littéral : les crochets sont une classe de
      # caractères pour le filtre de chemins d'Actions, pas du texte brut.)
      - 'src/app/**/explainers/**/page.tsx'
      # Le pool de quiz vit dans public/ mais porte des affirmations
      # éditoriales : il doit passer les mêmes règles que les fiches.
      - 'public/quiz-data-*.json'
      - 'scripts/quiz-lint.ts'
      # Une modification du linter doit faire tourner le linter : sans ces deux
      # motifs, un refactor du module ou du workflow passait sans être exercé
      # une seule fois par sa propre PR.
      - 'scripts/content-lint/**'
      - 'src/lib/faq-review.ts'
      # Parseur du frontmatter des gardes, fraîcheur des chapeaux, date du
      # résumé ; le schéma Velite décide des champs que ces gardes lisent.
      - 'src/lib/summary-freshness.ts'
      - 'src/lib/title-length.ts'
      - 'src/lib/summary-length.ts'
      - 'src/lib/frontmatter.ts'
      - 'src/lib/change-summary-date.ts'
      # Liste des vues immersives (garde de liens) et version de js-yaml (parseur
      # des gardes) : les changer change ce que les gardes acceptent.
      - 'src/lib/scrolly-allowlist.ts'
      - 'package-lock.json'
      - 'velite.config.ts'
      # Un changement de la table de routage peut casser des liens dans des
      # fiches que la PR ne touche pas : il doit relancer le contrôle des liens.
      - 'src/lib/internal-links.ts'
      - 'src/i18n/routing.ts'
      # Table des redirections permanentes et garde des slugs de dossiers : une
      # PR qui ne touche que la table peut casser une URL publique.
      - 'src/lib/redirects-301.ts'
      - 'src/lib/slug-redirects.ts'
      # slug-redirects.ts reproduit le routage de toutes les pages [slug]
      # (dossiers, domaines, solutions, secteurs, comparaisons, communes,
      # archives, vérifications) et en réutilise les accesseurs purs : une
      # modification de ce routage doit relancer la garde. content/** et
      # src/i18n/routing.ts (segments localisés) sont déjà couverts plus haut.
      - 'src/lib/content.ts'
      - 'src/lib/velite-date.ts'
      # Pages [slug] (src/app/[locale]/{type}/[slug]/page.tsx) sans crochets
      # littéraux, qui seraient une classe de caractères ; déclenche aussi sur
      # d'autres pages à trois niveaux, sans dommage. Vue immersive à part.
      - 'src/app/*/*/*/page.tsx'
      - 'src/app/*/dossiers/**'
      # Pages fixes : une page.tsx supprimée ou déplacée (sous [locale] ou non)
      # retire une URL publique ; le matcher du proxy décide quelles pages hors
      # [locale] sont servies sans préfixe de langue.
      - 'src/app/**/page.tsx'
      - 'src/proxy.ts'
      - 'next.config.ts'
      - '.github/workflows/content-lint.yml'

jobs:
  content-lint:
    name: Editorial content checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Get changed content files
        run: |
          # core.quotepath=off : sans lui, git cite un chemin accentué entre
          # guillemets avec des échappements octaux, et le fichier n'est plus trouvé.
          git -c core.quotepath=off diff --name-only origin/${{ github.base_ref }}...HEAD -- 'content/' \
            | grep '\.mdx$' > /tmp/changed_content.txt || true
          echo "Changed MDX files:"
          cat /tmp/changed_content.txt
          echo "---"

      # Le module qui garde le contenu doit lui-même être gardé : ces quatre cas
      # vérifient qu'il attrape une phrase temporelle et des sources vides, qu'il
      # laisse passer les cas propres, et surtout qu'il échoue FERMÉ si son fichier
      # de motifs est vide, plutôt que de se taire.
      - name: Tests du module content-lint
        run: npx vitest run scripts/content-lint/content-lint.test.ts

      # Les trois checks éditoriaux viennent de scripts/content-lint/lib.sh,
      # source unique partagée avec scripts/preflight.sh. Ils étaient auparavant
      # réimplémentés ici en YAML et une seconde fois dans preflight : deux copies
      # d'une même garde finissent par diverger, et c'est arrivé (la copie locale
      # sautait silencieusement le check temporel quand son fichier de motifs
      # était vide, là où la CI échouait).
      #
      # Le label `skip-lastmodified-check` reste lu ici, car un correctif publié
      # le même jour que la fiche qu'il corrige ne peut pas faire bouger la date.
      #
      # run.sh lance aussi, en premier et même sans .mdx modifié, le contrôle des
      # URL publiées : une page (dossier, domaine, commune…) servie sur la base
      # et perdue par la PR exige son entrée dans src/lib/redirects-301.ts, ou
      # un retrait explicite dans URLS_RETIREES.
      - name: Phrases temporelles, sources vides, lastModified
        env:
          SKIP_LASTMODIFIED: ${{ contains(github.event.pull_request.labels.*.name, 'skip-lastmodified-check') && '1' || '0' }}
        run: bash scripts/content-lint/run.sh "origin/${{ github.base_ref }}"

      # Le chapeau `summary` est le seul champ éditorial que rien ne demandait
      # de relire : `changeSummary` est réécrit chaque veille, `lastModified` et
      # `sources` sont vérifiés ci-dessus, le chapeau pouvait vieillir derrière
      # une fiche par ailleurs fraîche. Il alimente pourtant la meta description,
      # le JSON-LD, le bouton Partager, le prompt du chatbot, l'API publique et
      # le repli du digest. Constat du 2026-08-30 : douze des treize fiches
      # domaines avaient un chapeau de plus de nonante jours.
      - name: Chapeau (summary) relu depuis moins de 90 jours
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-summary-check') }}
        run: |
          if [ ! -s /tmp/changed_content.txt ]; then
            echo "No MDX files changed, skipping"; exit 0
          fi
          npx tsx scripts/content-lint/summary-freshness.ts /tmp/changed_content.txt

      # WhatChangedBanner n'affiche un changeSummary que s'il porte sa date. Le
      # 2026-09-11, les fiches lez et housing-sector de la veille de la veille
      # n'avaient pas la date : bandeau vide en ligne, sans aucun signal.
      - name: changeSummary daté
        run: |
          if [ ! -s /tmp/changed_content.txt ]; then
            echo "No MDX files changed, skipping"; exit 0
          fi
          npx tsx scripts/content-lint/change-summary-date.ts /tmp/changed_content.txt "origin/${{ github.base_ref }}"

      # Velite pose bien un s.string().max(120) sur le titre des fiches secteur,
      # mais il le signale en `info` et laisse passer : les quatre fiches
      # education, de 125 a 139 caracteres, figurent dans .velite/sectorCards.json.
      # Un garde-fou qu'on croit actif et qui ne l'est pas est pire qu'un
      # garde-fou absent. 288 fiches etaient hors budget au 21/09/2026.
      - name: Titre dans le budget d'un résultat de recherche
        run: |
          if [ ! -s /tmp/changed_content.txt ]; then
            echo "No MDX files changed, skipping"; exit 0
          fi
          npx tsx scripts/content-lint/title-length.ts /tmp/changed_content.txt "origin/${{ github.base_ref }}"

      # Meme piege sur le chapeau : summary: s.string().max(500) sur six
      # collections, signale en `info` par Velite qui publie quand meme. Au
      # 22/09/2026, des chapeaux atteignaient le double du maximum. Comme pour le
      # titre, seuls les chapeaux nouveaux ou modifies bloquent. Le label
      # skip-summary-check ne s'applique pas ici : il suspend la relecture du
      # chapeau (etape plus haut), pas sa longueur.
      - name: Chapeau (summary) dans le maximum du schéma
        run: |
          if [ ! -s /tmp/changed_content.txt ]; then
            echo "No MDX files changed, skipping"; exit 0
          fi
          npx tsx scripts/content-lint/summary-length.ts /tmp/changed_content.txt "origin/${{ github.base_ref }}"

      # La FAQ vieillissait derrière le corps des fiches : sur les douze veilles
      # précédant le 2026-09-11, 35 fiches à FAQ ont été republiées et la FAQ n'a
      # été touchée que deux fois. Le 2026-09-10, la FAQ LEZ de `mobility`
      # contredisait le corps de la fiche le jour même. Toute fiche domaine ou
      # dossier republiée doit donc porter `faqReviewed` au moins égal à sa
      # `lastModified`, qu'elle ait une FAQ ou non. L'unicité des questions est
      # vérifiée sur tout le dépôt : une question, une seule fiche, par langue.
      # Le label suspend la relecture, jamais l'unicité.
      - name: FAQ relue et questions uniques
        env:
          SKIP_FAQ_REVIEW: ${{ contains(github.event.pull_request.labels.*.name, 'skip-faq-check') && '1' || '0' }}
        run: npx tsx scripts/content-lint/faq-check.ts /tmp/changed_content.txt

      # Constat du 2026-09-11 : 30 liens internes utilisaient le segment de
      # route d'une autre langue (redirection 307) et 4 un segment inventé,
      # /de/domaenen/, qui renvoyait une 404 en production depuis le 9 août.
      # Tout le dépôt est vérifié, hors archives du digest.
      - name: Liens internes sur le segment de route de leur langue
        run: npx tsx scripts/content-lint/internal-links.ts

      # Les pages /explainers/ n'ont pas de lastModified Velite : leur date de
      # réécriture, servie au sitemap, vient d'une table tenue à la main
      # (EXPLAINER_LAST_MODIFIED, src/lib/explainer-dates.ts). Constat du
      # 20/09/2026 : la table seedée la veille était déjà fausse un jour après
      # sa création (brussels-overview réécrite sans que la table bouge).
      - name: Date des pages /explainers/ à jour dans messages/*.json
        run: npx tsx scripts/content-lint/explainer-messages-date.ts "origin/${{ github.base_ref }}"

  quiz-lint:
    name: Quiz pool checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Structure et phrases temporelles bloquent ; les soupçons de fuite de
      # réponse sont affichés comme avertissements et demandent un arbitrage.
      - name: Lint des pools de quiz
        run: npm run quiz:lint

      # `reviewedCount` décide seul de l'affichage de la mention de l'article
      # 50, et rien ne le vérifiait : une valeur trop haute efface la mention
      # sur des questions jamais relues.
      - name: Compteurs de relecture conformes à l'état
        run: npm run quiz:review:check
