name: Smoke Test

# Vérifie que la PRODUCTION sert bien le commit qui vient d'être déployé.
#
# Le déclencheur n'est pas `push` : depuis le passage à Hetzner, pousser sur
# main ne déploie rien directement. `Deploy image` publie l'image sur GHCR,
# puis un timer systemd (bgm-deploy, OnUnitActiveSec=5min) la tire sur le VPS.
# Un smoke test lancé au push testait donc l'ANCIENNE version, quand il ne
# cherchait pas un déploiement Vercel qui n'existe plus.
on:
  workflow_run:
    workflows: ["Deploy image"]
    types: [completed]
  workflow_dispatch:

jobs:
  smoke:
    name: Post-deploy smoke test
    runs-on: ubuntu-latest
    # Inutile de sonder la prod si l'image n'a pas été publiée.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      BASE: https://governance.brussels
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Wait for the VPS to serve this commit
        run: |
          # Le timer tourne toutes les 5 min, plus le pull de l'image et le
          # redémarrage du conteneur : 15 min couvrent le cas normal sans
          # laisser un job pendu indéfiniment.
          TIMEOUT=900
          INTERVAL=20
          ELAPSED=0

          if [ -z "$EXPECTED_SHA" ]; then
            echo "Déclenchement manuel sans commit de référence : on vérifie"
            echo "seulement que la prod répond, pas quelle version elle sert."
            exit 0
          fi

          echo "Commit attendu en production : $EXPECTED_SHA"

          while [ $ELAPSED -lt $TIMEOUT ]; do
            BODY=$(curl -s --max-time 30 "$BASE/api/health" || true)
            SERVED=$(echo "$BODY" | jq -r '.version // empty' 2>/dev/null || true)

            if [ "$SERVED" = "$EXPECTED_SHA" ]; then
              echo "OK: la production sert $SERVED (après ${ELAPSED}s)"
              exit 0
            fi

            # `unknown` = image construite sans BUILD_SHA, ou version antérieure
            # à l'introduction du champ. On continue d'attendre plutôt que
            # d'échouer : le VPS n'a peut-être pas encore tiré la nouvelle.
            echo "en attente… servi=${SERVED:-<absent>} (${ELAPSED}s/${TIMEOUT}s)"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "ÉCHEC : après ${TIMEOUT}s la production sert encore '${SERVED:-<absent>}'"
          echo "au lieu de $EXPECTED_SHA."
          echo "Pistes : timer bgm-deploy arrêté sur le VPS, pull GHCR en échec,"
          echo "ou conteneur qui ne redémarre pas. Vérifier bgm-deploy.service."
          exit 1

      - name: HTTP availability checks
        run: |
          for ROUTE in "/" "/fr" "/fr/data"; do
            HTTP=$(curl -o /dev/null -s -w "%{http_code}" -L --max-time 30 "$BASE$ROUTE")
            if [ "$HTTP" != "200" ]; then
              echo "FAIL: $BASE$ROUTE returned $HTTP"; exit 1
            fi
            echo "OK: $BASE$ROUTE → $HTTP"
          done

      - name: Pagefind probe
        run: |
          HTTP=$(curl -o /dev/null -s -w "%{http_code}" --max-time 30 "$BASE/pagefind/pagefind.js")
          if [ "$HTTP" != "200" ]; then
            echo "FAIL: pagefind.js returned $HTTP (search index may not be served)"; exit 1
          fi
          echo "OK: pagefind.js → $HTTP"
