name: Smoke Test

# Principe du moindre privilege. Sans ce bloc, le GITHUB_TOKEN herite du defaut
# du depot, qui peut etre `write-all` : un workflow de verification obtenait
# alors des droits d ecriture dont il n a aucun usage (audit 21/09).
permissions:
  contents: read

# Vérifie que la PRODUCTION sert bien le commit qui vient d'être déployé.
#
# Le déclencheur n'est pas `push` : depuis le passage à Hetzner, pousser sur
# main ne déploie rien directement. `Deploy image` publie l'image sur GHCR,
# puis un timer systemd (bgm-deploy, OnUnitActiveSec=5min) la tire sur le VPS.
# Un smoke test lancé au push testait donc l'ANCIENNE version, quand il ne
# cherchait pas un déploiement Vercel qui n'existe plus.
on:
  workflow_run:
    workflows: ["Deploy image"]
    types: [completed]
  workflow_dispatch:

jobs:
  smoke:
    name: Post-deploy smoke test
    runs-on: ubuntu-latest
    # Inutile de sonder la prod si l'image n'a pas été publiée.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      BASE: https://governance.brussels
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      # Les scripts de sonde et l'action d'alerte seulement : pas de npm ci,
      # node seul (préinstallé sur le runner).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            scripts/ops
            .github/actions

      - name: Wait for the VPS to serve this commit
        run: |
          # Le timer tourne toutes les 5 min, plus le pull de l'image et le
          # redémarrage du conteneur : 15 min couvrent le cas normal sans
          # laisser un job pendu indéfiniment.
          TIMEOUT=900
          INTERVAL=20
          ELAPSED=0

          if [ -z "$EXPECTED_SHA" ]; then
            echo "Déclenchement manuel sans commit de référence : on vérifie"
            echo "seulement que la prod répond, pas quelle version elle sert."
            exit 0
          fi

          echo "Commit attendu en production : $EXPECTED_SHA"

          while [ $ELAPSED -lt $TIMEOUT ]; do
            BODY=$(curl -s --max-time 30 "$BASE/api/health" || true)
            SERVED=$(echo "$BODY" | jq -r '.version // empty' 2>/dev/null || true)

            if [ "$SERVED" = "$EXPECTED_SHA" ]; then
              echo "OK: la production sert $SERVED (après ${ELAPSED}s)"
              exit 0
            fi

            # `unknown` = image construite sans BUILD_SHA, ou version antérieure
            # à l'introduction du champ. On continue d'attendre plutôt que
            # d'échouer : le VPS n'a peut-être pas encore tiré la nouvelle.
            echo "en attente… servi=${SERVED:-<absent>} (${ELAPSED}s/${TIMEOUT}s)"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "ÉCHEC : après ${TIMEOUT}s la production sert encore '${SERVED:-<absent>}'"
          echo "au lieu de $EXPECTED_SHA."
          echo "Pistes : timer bgm-deploy arrêté sur le VPS, pull GHCR en échec,"
          echo "ou conteneur qui ne redémarre pas. Vérifier bgm-deploy.service."
          exit 1

      - name: HTTP availability checks
        run: |
          source scripts/ops/http.sh
          for ROUTE in "/" "/fr" "/fr/data"; do
            exiger_code 200 "$BASE$ROUTE" -L
          done

      - name: Pagefind probe
        run: |
          source scripts/ops/http.sh
          exiger_code 200 "$BASE/pagefind/pagefind.js" || {
            echo "(l'index de recherche n'est peut-être pas servi)"; exit 1; }

      # Un code 200 ne dit rien du contenu : du 24 au 28/09/2026, l'accueil a
      # répondu 200 avec un bloc « Ce qu'on surveille » figé (revues blue P0,
      # purple P3). Contrôle minimal ici (blocs datés présents dans les quatre
      # langues) ; la comparaison des dates aux données est faite toutes les
      # 6 h par la sonde du VPS (bgm-ops, deploy/sonde-accueil).
      - name: Homepage content (4 locales)
        run: |
          ECHEC=0
          for LOC in fr nl en de; do
            F="$RUNNER_TEMP/accueil-$LOC.html"; rm -f "$F"
            curl -s -L --max-time 30 --retry 2 --retry-delay 10 --retry-all-errors \
              -o "$F" "$BASE/$LOC?cb=$RANDOM$RANDOM" || true
            node scripts/ops/controle-contenu-accueil.mjs "$F" "/$LOC" || ECHEC=1
          done
          exit $ECHEC

      # Environ 80 % des visites arrivent sur une fiche. Le formulaire
      # d'inscription y est posé en haut et en bas (lot 2 de l'abonnement,
      # 02/10/2026) : s'il disparaît, aucun code HTTP ne le dit.
      - name: Fiche content (formulaire d'inscription)
        run: |
          F="$RUNNER_TEMP/fiche-lez.html"; rm -f "$F"
          curl -s -L --max-time 30 --retry 2 --retry-delay 10 --retry-all-errors \
            -o "$F" "$BASE/fr/dossiers/lez?cb=$RANDOM$RANDOM" || true
          node scripts/ops/controle-contenu-fiche.mjs "$F" "/fr/dossiers/lez"

      # Sans cette étape, un smoke rouge n'existait que dans l'onglet Actions
      # (revue blue, P1 : deux échecs le 28/09 vus par personne), et il coupe
      # aussi le test de régression, qui ne se lance qu'après un smoke réussi.
      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/alerte-resend
        with:
          sujet: "[BGM] smoke test post-déploiement en ÉCHEC"
          texte: |
            Le smoke test a échoué après le déploiement de ${{ env.EXPECTED_SHA || 'un déclenchement manuel' }}.
            La production ne sert peut-être pas ce commit, ou une page clé (accueil, données, recherche) ne répond pas ou a perdu son contenu.

            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          resend-api-key: ${{ secrets.RESEND_API_KEY }}
          admin-email: ${{ secrets.ADMIN_EMAIL }}
